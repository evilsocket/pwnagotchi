version: 2.1

orbs:
  python: circleci/python@2.1.1
    gh: circleci/github-cli@2.3.0

    parameters:
      # Change these if your fork or upstream differs
        pwn_fork_url:
            type: string
                default: "git@github.com:YOUR_GH_USERNAME/pwnagotchi.git"
                  pwn_upstream_url:
                      type: string
                          default: "https://github.com/evilsocket/pwnagotchi.git"
                            pwn_branch:
                                type: string
                                    default: "master"
                                      eval_command:
                                          type: string
                                              default: "pytest -q"   # replace with your eval entrypoint

                                              executors:
                                                py:
                                                    docker:
                                                          - image: cimg/python:3.11
                                                              resource_class: medium
                                                                  environment:
                                                                        PIP_CACHE_DIR: ~/.cache/pip

                                                                        commands:
                                                                          setup-repo:
                                                                              description: "Checkout this repo and prime Python"
                                                                                  steps:
                                                                                        - checkout
                                                                                              - run:
                                                                                                        name: Show context
                                                                                                                  command: |
                                                                                                                              python --version
                                                                                                                                          pip --version
                                                                                                                                                - restore_cache:
                                                                                                                                                          keys:
                                                                                                                                                                      - v1-pip-{{ arch }}-{{ .Branch }}-{{ checksum "requirements.txt" }}
                                                                                                                                                                                  - v1-pip-{{ arch }}-{{ .Branch }}
                                                                                                                                                                                              - v1-pip
                                                                                                                                                                                                    - run:
                                                                                                                                                                                                              name: Install deps (if present)
                                                                                                                                                                                                                        command: |
                                                                                                                                                                                                                                    if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
                                                                                                                                                                                                                                          - save_cache:
                                                                                                                                                                                                                                                    key: v1-pip-{{ arch }}-{{ .Branch }}-{{ checksum "requirements.txt" }}
                                                                                                                                                                                                                                                              paths:
                                                                                                                                                                                                                                                                          - ~/.cache/pip

                                                                                                                                                                                                                                                                            clone-pwn:
                                                                                                                                                                                                                                                                                description: "Clone/fetch Pwnagotchi fork and add upstream"
                                                                                                                                                                                                                                                                                    steps:
                                                                                                                                                                                                                                                                                          - run:
                                                                                                                                                                                                                                                                                                    name: Clone fork
                                                                                                                                                                                                                                                                                                              command: |
                                                                                                                                                                                                                                                                                                                          rm -rf pwnagotchi
                                                                                                                                                                                                                                                                                                                                      git clone << pipeline.parameters.pwn_fork_url >> pwnagotchi
                                                                                                                                                                                                                                                                                                                                            - run:
                                                                                                                                                                                                                                                                                                                                                      name: Add upstream + fetch
                                                                                                                                                                                                                                                                                                                                                                working_directory: pwnagotchi
                                                                                                                                                                                                                                                                                                                                                                          command: |
                                                                                                                                                                                                                                                                                                                                                                                      git remote remove upstream 2>/dev/null || true
                                                                                                                                                                                                                                                                                                                                                                                                  git remote add upstream "<< pipeline.parameters.pwn_upstream_url >>
                                                                                                                                                                                                                                                                                                                                                                                                              git fetch --all --prune

                                                                                                                                                                                                                                                                                                                                                                                                                rebase-fork-on-upstream:
                                                                                                                                                                                                                                                                                                                                                                                                                    description: "Rebase fork on upstream and push if changes"
                                                                                                                                                                                                                                                                                                                                                                                                                        steps:
                                                                                                                                                                                                                                                                                                                                                                                                                              - run:
                                                                                                                                                                                                                                                                                                                                                                                                                                        name: Rebase + push
                                                                                                                                                                                                                                                                                                                                                                                                                                                  working_directory: pwnagotchi
                                                                                                                                                                                                                                                                                                                                                                                                                                                            command: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        git checkout << pipeline.parameters.pwn_branch >>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    git pull --rebase upstream << pipeline.parameters.pwn_branch >>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                CHANGES=$(git log origin/<< pipeline.parameters.pwn_branch >>..HEAD --oneline | wc -l | tr -d ' ')
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if [ "$CHANGES" != "0" ]; then
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          # Auth: use SSH key (recommended) or GH token if using https
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        git push origin HEAD:<< pipeline.parameters.pwn_branch >>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      echo "Pushed $CHANGES upstream commits into fork."
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  else
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                echo "No changes to push."
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            fi

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              open-sync-pr:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  description: "Optionally open a PR documenting the sync (requires GH token)"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      steps:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            - gh/install
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  - run:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            name: Open PR if branch is not default (optional)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      working_directory: pwnagotchi
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                command: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            # Requires: GH_TOKEN context/variable and repo permissions.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        # If you sync to a feature branch, uncomment below to open PR.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    # gh auth setup-git
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                # gh pr create \
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            #   --title "Sync: upstream -> fork (<< pipeline.parameters.pwn_branch >>)" \
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        #   --body "Automated sync via CircleCI." \
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    #   --base << pipeline.parameters.pwn_branch >> \
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                #   --head << pipeline.parameters.pwn_branch >>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            echo "PR step skipped; enable by uncommenting above."

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            jobs:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              evals:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  executor: py
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      steps:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            - setup-repo
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  - run:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            name: Run evals/tests
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      command: << pipeline.parameters.eval_command >>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        pwn-sync:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            executor: py
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                steps:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      - clone-pwn
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            - rebase-fork-on-upstream
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  - open-sync-pr

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    pwn-evals:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        executor: py
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            steps:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  - clone-pwn
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        - run:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  name: Install Pwnagotchi test deps (best-effort)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            working_directory: pwnagotchi
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      command: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt || true; fi
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    - run:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              name: Run Pwnagotchi tests/evals
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        working_directory: pwnagotchi
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  command: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              if [ -f pyproject.toml ] || [ -f setup.cfg ] || [ -f setup.py ]; then
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            pytest -q || true
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        else
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      echo "No Python test config found; skipping."
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  fi

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  workflows:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    version: 2
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      ci:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          when: on_success
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              jobs:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    - evals
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          - pwn-evals

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            nightly-sync:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                triggers:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      - schedule:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                cron: "17 4 * * *"   # 04:17 UTC daily — change as needed
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          filters:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      branches:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    only:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    - master
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    - main
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        jobs:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              - pwn-sync